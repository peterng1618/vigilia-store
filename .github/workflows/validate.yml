name: validate

# A pull request may only be merged when every catalogue directory it touches
# validates with the app's own reader. The check runs the pinned app commit, not
# the PR's code: a submission carries data, never a program.

on:
  pull_request:
    paths: ["catalogue/**"]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: peterng1618/vigilia
          ref: 682379fc70e93e8d6e618adff96de8e472bf20b3
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: app/src/web
      - run: npm run build
        working-directory: app/src/web

      - name: every changed catalogue directory validates
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          # The directories this PR touches, each once. A path that is not under
          # catalogue/<id>/ is not a submission and is refused here rather than
          # silently skipped.
          dirs=$(git diff --name-only "$base" HEAD -- catalogue | cut -d/ -f1-2 | sort -u)
          if [ -z "$dirs" ]; then
            echo "No catalogue directory changed." >&2
            exit 1
          fi
          status=0
          for dir in $dirs; do
            id="${dir#catalogue/}"
            previous_item=$(mktemp)
            previous_package=$(mktemp)
            # A directory the base commit already holds is an update: the
            # version ruling needs the base's own header and package, and the
            # validator derives it from those bytes rather than a claim in the
            # PR. A directory the base does not hold is a first submission.
            if git cat-file -e "$base:catalogue/$id/item.json" 2>/dev/null; then
              if ! git show "$base:catalogue/$id/item.json" > "$previous_item"; then
                echo "The base commit's catalogue/$id/item.json cannot be read." >&2
                status=1
                rm -f "$previous_item" "$previous_package"
                continue
              fi
              if ! git show "$base:catalogue/$id/$id.zip" > "$previous_package"; then
                echo "The base commit holds catalogue/$id/item.json but no catalogue/$id/$id.zip." >&2
                status=1
                rm -f "$previous_item" "$previous_package"
                continue
              fi
              if ! node app/src/web/packages/host/bin/vigilia.js validate-item "$dir" \
                --previous-item "$previous_item" --previous-package "$previous_package"; then
                status=1
              fi
            else
              if ! node app/src/web/packages/host/bin/vigilia.js validate-item "$dir"; then
                status=1
              fi
            fi
            rm -f "$previous_item" "$previous_package"
          done
          exit $status
