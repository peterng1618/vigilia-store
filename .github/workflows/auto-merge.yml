name: auto-merge

# The trust ladder's second rung, and a security boundary rather than a
# convenience: a verified author's own PR merges only when all three hold —
# the author is in `verified-authors.txt` on `main`, the diff touches one
# `catalogue/<id>/` directory the author owns and nothing else, and the
# `validate` check on THIS head is green.
#
# **Ownership is read from git, not from the item file.** `item.json` carries no
# author, so the catalogue's one record of who an item belongs to is the author
# of the latest commit on `main` that touched its directory. A directory that
# does not exist on `main` is a first submission and belongs to whoever opened
# the PR; a directory that does exist is allowed only for that commit's author,
# and an unknown author refuses rather than reading as a first submission.
# Both ends of a rename count as changed paths, so moving another author's item
# out of its directory is a change to a directory the PR author does not own.
#
# **Every step after the author check is gated on that check's output**, and the
# check itself fails the job: an unverified author gets a red run and no merge
# step is ever reached.
#
# `pull_request_target` gives the job a write token. That is safe here only
# because the workflow never checks out or runs the pull request's code: the
# checkout below is `main`, and every PR path is read through the API.
#
# A second trigger, `workflow_run` on `validate` completing: the wait below can
# outlive its window when a cold runner queues, and no other event would retry
# the merge. That run resolves the open pull request from validate's head
# commit and then uses the same gated steps.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ["catalogue/**"]
  workflow_run:
    workflows: [validate]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: verified-authors.txt

      - name: resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          EVENT_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request_target" ]; then
            number="$EVENT_NUMBER"
            author="$EVENT_AUTHOR"
            sha="$EVENT_SHA"
          else
            # `workflow_run` carries no pull request payload. The head commit is
            # what both events share, and GitHub reports the open PR for it.
            sha="$HEAD_SHA"
            number=$(gh api "repos/$REPO/commits/$sha/pulls" \
              --jq '[.[] | select(.state == "open")][0].number // ""')
            if [ -z "$number" ]; then
              echo "No open pull request for $sha; nothing to merge."
              exit 0
            fi
            author=$(gh api "repos/$REPO/pulls/$number" --jq '.user.login')
          fi
          {
            echo "number=$number"
            echo "author=$author"
            echo "head=$sha"
            echo "proceed=true"
          } >> "$GITHUB_OUTPUT"

      - name: the author is verified
        id: verified
        if: steps.pr.outputs.proceed == 'true'
        env:
          AUTHOR: ${{ steps.pr.outputs.author }}
        run: |
          set -euo pipefail
          echo "verified=false" >> "$GITHUB_OUTPUT"
          if ! grep -qxF "$AUTHOR" verified-authors.txt; then
            echo "$AUTHOR is not in verified-authors.txt; the owner reviews this PR." >&2
            exit 1
          fi
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: the diff touches one directory the author owns
        if: steps.verified.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          AUTHOR: ${{ steps.pr.outputs.author }}
        run: |
          set -euo pipefail
          # Both ends of a rename, because GitHub reports only the new path in
          # `filename`: a rename out of another author's directory would
          # otherwise look like a first submission.
          gh api "repos/$REPO/pulls/$NUMBER/files" --paginate \
            --jq '.[] | [.filename, (.previous_filename // "")] | @tsv' > files.tsv
          if [ ! -s files.tsv ]; then
            echo "The pull request changes no file." >&2
            exit 1
          fi
          cut -f1 files.tsv > paths.txt
          cut -f2 files.tsv | grep -v '^$' >> paths.txt || true
          bad=$(grep -Ev '^catalogue/[A-Za-z0-9_-]{1,64}/[^/]+$' paths.txt || true)
          if [ -n "$bad" ]; then
            echo "Refused: a path outside catalogue/<id>/:" >&2
            echo "$bad" >&2
            exit 1
          fi
          dirs=$(cut -d/ -f2 paths.txt | sort -u)
          if [ "$(printf '%s\n' "$dirs" | wc -l)" -ne 1 ]; then
            echo "Refused: the diff spans more than one catalogue directory:" >&2
            echo "$dirs" >&2
            exit 1
          fi
          id=$(printf '%s\n' "$dirs")
          echo "Single directory: catalogue/$id"
          # **A directory that does not exist on `main` is a first submission.**
          # Existence is tested explicitly rather than inferred from commits: a
          # deleted directory still has commits, and a legitimate reuse of its
          # id must not inherit the previous owner.
          #
          # A directory that does exist is owned by the author of the latest
          # commit touching it on `main`. An unknown author — an email not
          # linked to an account, or a deleted account — refuses: no owner is
          # not the same as no owner yet. A maintainer's direct push into a
          # contributor's directory makes the maintainer that recorded owner, so
          # later changes to the directory are the maintainer's to review.
          if git cat-file -e "HEAD:catalogue/$id" 2>/dev/null; then
            owner=$(gh api "repos/$REPO/commits?path=catalogue/$id&per_page=1" \
              --jq '.[0].author.login // ""')
            if [ -z "$owner" ]; then
              echo "Refused: catalogue/$id exists on main but its latest commit has no linked author, so no owner can approve this update." >&2
              exit 1
            fi
            if [ "$owner" != "$AUTHOR" ]; then
              echo "Refused: catalogue/$id belongs to $owner, not $AUTHOR." >&2
              exit 1
            fi
          fi

      - name: the validate check on this head is green
        if: steps.verified.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            conclusion=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select(.name == "validate") | .conclusion] | first // "waiting"')
            case "$conclusion" in
              success) echo "validate is green on $SHA"; exit 0 ;;
              failure|cancelled|timed_out|action_required)
                echo "validate concluded $conclusion; not merging." >&2
                exit 1 ;;
            esac
            sleep 10
          done
          echo "validate did not conclude within ten minutes; not merging." >&2
          exit 1

      - name: squash-merge
        id: merge
        if: steps.verified.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          VALIDATED_SHA: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          # The check-run above proved VALIDATED_SHA, not the PR's current
          # head: a push that lands while this job runs would otherwise merge
          # bytes validate never saw. Re-read the head and refuse a moved one,
          # naming both. `--match-head-commit` closes the remaining window
          # between this read and the merge itself.
          # Two triggers can reach this step for one PR: the
          # `pull_request_target` event and the `workflow_run` retry. The second
          # then meets a PR that is already merging and fails with "Merge
          # already in progress" (run 39723545537), which turns a normal merge
          # into a red run nobody should have to explain. A PR that is no longer
          # open has nothing left to do here.
          state=$(gh pr view "$NUMBER" --repo "$REPO" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "PR #$NUMBER is $state; nothing to merge."
            exit 0
          fi
          current=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.head.sha')
          if [ "$current" != "$VALIDATED_SHA" ]; then
            echo "Refused: the pull request's head is $current, but $VALIDATED_SHA was validated; the new head has not passed validate." >&2
            exit 1
          fi
          gh pr merge "$NUMBER" --repo "$REPO" --squash \
            --match-head-commit "$VALIDATED_SHA"

  # A merge made with `GITHUB_TOKEN` starts no workflow, so index.yml's push
  # trigger never fires. Regenerating here is what keeps the listing current.
  regenerate:
    needs: auto-merge
    if: needs.auto-merge.outputs.merged == 'true'
    uses: ./.github/workflows/index.yml
    permissions:
      contents: write
