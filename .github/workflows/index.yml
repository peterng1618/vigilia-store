name: index
on:
  push:
    branches: [main]
    # The workflow's own path is listed so the commit that adds it runs it: a
    # filter on `catalogue/**` alone would have left the first push silent and
    # the index missing until someone added an item.
    paths: ["catalogue/**", "index.json", ".github/workflows/index.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: peterng1618/vigilia
          ref: 2c315a9d08cf399bd44e4f857be1e82699783b76
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: app/src/web
      - run: npm run build
        working-directory: app/src/web
      - run: |
          node app/src/web/packages/host/bin/vigilia.js \
            --build-catalogue-index catalogue --out index.json \
            --generated-at "$(git log -1 --format=%cI)"
      - run: |
          git config user.name  "vigilia-index"
          git config user.email "vigilia-index@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || git commit -m "chore(index): regenerate"
          git push
