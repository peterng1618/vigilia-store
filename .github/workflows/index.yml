name: index
on:
  push:
    branches: [main]
    # The workflow's own path is listed so the commit that adds it runs it: a
    # filter on `catalogue/**` alone would have left the first push silent and
    # the index missing until someone added an item.
    paths: ["catalogue/**", "index.json", ".github/workflows/index.yml"]
  workflow_dispatch:
  # Called by auto-merge after it merges: a push made with `GITHUB_TOKEN` starts
  # no workflow, so the listing would otherwise go stale until a human pushed.
  workflow_call:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      # `ref: main`, not the caller's sha: auto-merge calls this after it
      # merges, and a workflow_call resolves its context before the merge, so
      # the default checkout would read the tree the new item is still missing.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: peterng1618/vigilia
          ref: 682379fc70e93e8d6e618adff96de8e472bf20b3
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: app/src/web
      - run: npm run build
        working-directory: app/src/web
      - run: |
          node app/src/web/packages/host/bin/vigilia.js \
            --build-catalogue-index catalogue --out index.json \
            --generated-at "$(git log -1 --format=%cI)"
      - run: |
          git config user.name  "vigilia-index"
          git config user.email "vigilia-index@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || git commit -m "chore(index): regenerate"
          # Two runs can meet: the auto-merge workflow regenerates on a merge
          # while a human pushes a commit. A bare push then fails and the
          # listing stays stale (run 39712491830). Rebase onto whatever landed
          # and try again, a bounded number of times.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main || { git rebase --abort || true; exit 1; }
            if git push origin main; then
              exit 0
            fi
            sleep 5
          done
          echo "the index could not be pushed after three attempts" >&2
          exit 1
